services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: lab-ch10-p5-etcd
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    ports:
      - "2379:2379"

  lab:
    image: ghcr.io/anmisttt/ddia-practice:ch10-p5
    container_name: lab-ch10-p5
    working_dir: /work
    volumes:
      - ./:/work
    command: ["sleep", "infinity"]
