name: ch3-event-sourcing

services:
  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./initial_order_events.txt:/lab/initial_order_events.txt:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic order-events \
          --partitions 1 \
          --replication-factor 1 \
          --config retention.ms=-1
        /opt/kafka/bin/kafka-console-producer.sh \
          --bootstrap-server kafka:9092 \
          --topic order-events \
          --reader-property parse.key=true \
          --reader-property key.separator='|' \
          < /lab/initial_order_events.txt
        touch /tmp/kafka-seeded
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/kafka-seeded"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: order_views
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres_views.sql:/docker-entrypoint-initdb.d/10-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_views"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.0.29-noble
    environment:
      MONGO_INITDB_DATABASE: order_views
    volumes:
      - mongo-data:/data/db
      - ./mongo_views.js:/docker-entrypoint-initdb.d/10-views.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 40

  app:
    image: ghcr.io/anmisttt/lab:ch3-p1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: order-events
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/order_views
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: order_views
    depends_on:
      kafka-init:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    working_dir: /lab
    volumes:
      - ./:/lab
    command: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "python", "-c", "import confluent_kafka, psycopg, pymongo"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  kafka-data:
  postgres-data:
  mongo-data:
