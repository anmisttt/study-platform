name: ch3-graphql-multi-store

services:
  seed-assets:
    image: ghcr.io/anmisttt/ddia-practice:ch3-p1
    volumes:
      - postgres-init:/seed/postgres
      - mongo-init:/seed/mongo
      - neo4j-init:/seed/neo4j
    command:
      - bash
      - -c
      - |
        cp /lab/image/postgres_seed.sql /seed/postgres/10-dashboard.sql
        cp /lab/image/mongo_seed.js /seed/mongo/10-dashboard.js
        cp /lab/image/neo4j_seed.cypher /seed/neo4j/10-dashboard.cypher

  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      seed-assets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.0.29-noble
    environment:
      MONGO_INITDB_DATABASE: dashboard
    volumes:
      - mongo-data:/data/db
      - mongo-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      seed-assets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 40

  neo4j:
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: neo4j/graphpass
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphpass 'RETURN 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  neo4j-seed:
    image: neo4j:5.26.30-community
    depends_on:
      seed-assets:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
    volumes:
      - neo4j-init:/seed:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - cypher-shell -a neo4j://neo4j:7687 -u neo4j -p graphpass -f /seed/10-dashboard.cypher

  app:
    image: ghcr.io/anmisttt/ddia-practice:ch3-p1
    environment:
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/dashboard
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: dashboard
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphpass
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      neo4j-seed:
        condition: service_completed_successfully
    working_dir: /lab
    volumes:
      - ./:/lab
    command: ["tail", "-f", "/dev/null"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('graphql'); require('pg'); require('mongodb'); require('neo4j-driver')"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  postgres-init:
  mongo-data:
  mongo-init:
  neo4j-data:
  neo4j-init:
