services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: lab-ch10-p4-etcd
    environment:
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    volumes:
      - ./:/work
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 20

  lab:
    image: ghcr.io/anmisttt/lab:ch10-p4
    container_name: lab-ch10-p4
    working_dir: /work
    environment:
      ETCDCTL_API: "3"
    volumes:
      - ./:/work
    command: ["sleep", "infinity"]
    depends_on:
      etcd:
        condition: service_healthy

volumes:
  etcd-data:
