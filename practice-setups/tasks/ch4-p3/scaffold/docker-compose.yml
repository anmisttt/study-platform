services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: ch4_lab
    ports:
      - "3306:3306"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
  lab:
    image: ghcr.io/anmisttt/ddia-practice:ch4-p3
    entrypoint: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - .:/work
