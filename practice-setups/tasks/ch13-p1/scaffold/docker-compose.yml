services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./preloaded_data/fx-rates.txt:/lab/fx-rates.txt:ro
      - ./preloaded_data/fx-purchases.txt:/lab/fx-purchases.txt:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in fx.rates fx.purchases fx.purchase-usd; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 1 \
            --replication-factor 1
        done
        /opt/kafka/bin/kafka-console-producer.sh \
          --bootstrap-server kafka:29092 \
          --topic fx.rates \
          --property parse.key=true \
          --property key.separator='|' \
          < /lab/fx-rates.txt
        /opt/kafka/bin/kafka-console-producer.sh \
          --bootstrap-server kafka:29092 \
          --topic fx.purchases \
          --property parse.key=true \
          --property key.separator='|' \
          < /lab/fx-purchases.txt
        touch /tmp/kafka-seeded
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/kafka-seeded"]
      interval: 2s
      timeout: 2s
      retries: 30

  streams:
    image: gradle:8.10.2-jdk17
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRADLE_USER_HOME: /tmp/gradle-home
    volumes:
      - .:/workspace
      - gradle-cache:/tmp/gradle-home
    depends_on:
      kafka-init:
        condition: service_healthy

volumes:
  gradle-cache:
