services:
  seed-assets:
    image: ghcr.io/anmisttt/lab:ch13-p2
    volumes:
      - postgres-init:/seed-out
    command:
      - bash
      - -c
      - cp /lab/image/seed.sql /seed-out/01-seed.sql

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ch13_idem_lab
    ports:
      - "5433:5432"
    volumes:
      - postgres-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      seed-assets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ch13_idem_lab"]
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30

  client:
    image: ghcr.io/anmisttt/lab:ch13-p2
    working_dir: /work
    command: ["sleep", "infinity"]
    volumes:
      - .:/work
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_DSN: host=postgres port=5432 dbname=ch13_idem_lab user=postgres password=postgres
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-init:
