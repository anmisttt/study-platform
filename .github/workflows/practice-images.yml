name: Practice images

on:
  push:
    branches: [main]
    paths:
      - "practice-setups/**"
      - ".github/workflows/practice-images.yml"
  pull_request:
    paths:
      - "practice-setups/**"
      - ".github/workflows/practice-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: anmisttt
  BASE_PKG: ddia-practice-base
  TASK_PKG: ddia-practice

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bake targets match chapter JSON refs
        run: bash practice-setups/check-tag-drift.sh

  build:
    needs: drift-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push platform images
        uses: docker/bake-action@v6
        with:
          workdir: practice-setups
          files: docker-bake.hcl
          targets: default
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            *.platform=${{ matrix.platform }}
            *.args.TAG_SUFFIX=-${{ matrix.suffix }}-${{ github.sha }}
            variable.TAG_SUFFIX=-${{ matrix.suffix }}-${{ github.sha }}

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge multi-arch manifests
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd practice-setups
          tags=$(python3 -c "import json; print(' '.join(json.load(open('manifest.json'))['tasks'].keys()))")
          for tag in $tags; do
            docker buildx imagetools create -t "${REGISTRY}/${IMAGE_OWNER}/${TASK_PKG}:${tag}" \
              -t "${REGISTRY}/${IMAGE_OWNER}/${TASK_PKG}:${tag}-${SHA:0:7}" \
              "${REGISTRY}/${IMAGE_OWNER}/${TASK_PKG}:${tag}-amd64-${SHA}" \
              "${REGISTRY}/${IMAGE_OWNER}/${TASK_PKG}:${tag}-arm64-${SHA}"
          done
          docker buildx imagetools create -t "${REGISTRY}/${IMAGE_OWNER}/${BASE_PKG}:pg16" \
            "${REGISTRY}/${IMAGE_OWNER}/${BASE_PKG}:pg16-amd64-${SHA}" \
            "${REGISTRY}/${IMAGE_OWNER}/${BASE_PKG}:pg16-arm64-${SHA}"
